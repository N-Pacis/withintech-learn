<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 z" fill="#3d006b"/></marker></defs>
  <rect width="1200" height="480" rx="28" fill="#ffffff"/>
  <text x="600" y="70" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2937">You stay in the loop</text>
  <text x="600" y="108" text-anchor="middle" font-size="20" fill="#6b7280">AI drafts fast. You decide what ships.</text>
  <g font-size="22" font-weight="700" text-anchor="middle">
    <rect x="50" y="190" width="190" height="110" rx="20" fill="#f3e8ff" stroke="#3d006b" stroke-width="3"/><text x="145" y="240" fill="#3d006b">1. Prompt</text><text x="145" y="270" font-size="17" font-weight="400" fill="#1f2937">clear task + context</text>
    <rect x="280" y="190" width="190" height="110" rx="20" fill="#fff4ec" stroke="#ea7a28" stroke-width="3"/><text x="375" y="240" fill="#ea7a28">2. AI drafts</text><text x="375" y="270" font-size="17" font-weight="400" fill="#1f2937">code in seconds</text>
    <rect x="510" y="190" width="190" height="110" rx="20" fill="#3d006b"/><text x="605" y="240" fill="#ffffff">3. You review</text><text x="605" y="270" font-size="17" font-weight="400" fill="#ffffff">read every line</text>
    <rect x="740" y="190" width="190" height="110" rx="20" fill="#f3e8ff" stroke="#3d006b" stroke-width="3"/><text x="835" y="240" fill="#3d006b">4. Run &amp; test</text><text x="835" y="270" font-size="17" font-weight="400" fill="#1f2937">prove it works</text>
    <rect x="970" y="190" width="180" height="110" rx="20" fill="#e8f7ee" stroke="#15803d" stroke-width="3"/><text x="1060" y="240" fill="#15803d">5. Ship</text><text x="1060" y="270" font-size="17" font-weight="400" fill="#1f2937">you own it</text>
  </g>
  <g stroke="#3d006b" stroke-width="4" fill="none" marker-end="url(#a)">
    <line x1="242" y1="245" x2="272" y2="245"/><line x1="472" y1="245" x2="502" y2="245"/><line x1="702" y1="245" x2="732" y2="245"/><line x1="932" y1="245" x2="962" y2="245"/>
    <path d="M835 302 C835 420, 145 420, 145 310" stroke-dasharray="10 8"/>
  </g>
  <text x="490" y="430" text-anchor="middle" font-size="20" font-weight="700" fill="#3d006b">not right yet? refine the prompt and iterate</text>
</svg>
