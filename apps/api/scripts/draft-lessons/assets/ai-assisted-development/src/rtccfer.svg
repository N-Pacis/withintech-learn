<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="640" rx="28" fill="#ffffff"/>
  <text x="600" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2937">Anatomy of a strong coding prompt</text>
  <text x="600" y="98" text-anchor="middle" font-size="20" fill="#6b7280">RTCCFER: fill each part and the AI stops guessing</text>
  <g font-size="21">
    <rect x="60" y="125" width="1080" height="60" rx="14" fill="#faf5ff" stroke="#e9d5ff"/><rect x="60" y="125" width="70" height="60" rx="14" fill="#3d006b"/><text x="95" y="165" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">R</text><text x="150" y="163" font-weight="700" fill="#3d006b">Role</text><text x="330" y="163" fill="#1f2937">Who the AI should act as</text><text x="760" y="163" fill="#ea7a28" font-family="Menlo, monospace" font-size="18">senior Python developer</text>
<rect x="60" y="195" width="1080" height="60" rx="14" fill="#ffffff" stroke="#e9d5ff"/><rect x="60" y="195" width="70" height="60" rx="14" fill="#3d006b"/><text x="95" y="235" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">T</text><text x="150" y="233" font-weight="700" fill="#3d006b">Task</text><text x="330" y="233" fill="#1f2937">One clear job</text><text x="760" y="233" fill="#ea7a28" font-family="Menlo, monospace" font-size="18">write normalize_phone(raw)</text>
<rect x="60" y="265" width="1080" height="60" rx="14" fill="#faf5ff" stroke="#e9d5ff"/><rect x="60" y="265" width="70" height="60" rx="14" fill="#3d006b"/><text x="95" y="305" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">C</text><text x="150" y="303" font-weight="700" fill="#3d006b">Context</text><text x="330" y="303" fill="#1f2937">Project, existing code, edge cases</text><text x="760" y="303" fill="#ea7a28" font-family="Menlo, monospace" font-size="18">signup form; '0788 123 456'</text>
<rect x="60" y="335" width="1080" height="60" rx="14" fill="#ffffff" stroke="#e9d5ff"/><rect x="60" y="335" width="70" height="60" rx="14" fill="#3d006b"/><text x="95" y="375" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">C</text><text x="150" y="373" font-weight="700" fill="#3d006b">Constraints</text><text x="330" y="373" fill="#1f2937">Libraries, style, limits</text><text x="760" y="373" fill="#ea7a28" font-family="Menlo, monospace" font-size="18">stdlib only, type hints</text>
<rect x="60" y="405" width="1080" height="60" rx="14" fill="#faf5ff" stroke="#e9d5ff"/><rect x="60" y="405" width="70" height="60" rx="14" fill="#3d006b"/><text x="95" y="445" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">F</text><text x="150" y="443" font-weight="700" fill="#3d006b">Format</text><text x="330" y="443" fill="#1f2937">Exact shape of the answer</text><text x="760" y="443" fill="#ea7a28" font-family="Menlo, monospace" font-size="18">code + 5 pytest tests</text>
<rect x="60" y="475" width="1080" height="60" rx="14" fill="#ffffff" stroke="#e9d5ff"/><rect x="60" y="475" width="70" height="60" rx="14" fill="#3d006b"/><text x="95" y="515" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">E</text><text x="150" y="513" font-weight="700" fill="#3d006b">Examples</text><text x="330" y="513" fill="#1f2937">Input → output pairs</text><text x="760" y="513" fill="#ea7a28" font-family="Menlo, monospace" font-size="18">'12345' → ValueError</text>
<rect x="60" y="545" width="1080" height="60" rx="14" fill="#faf5ff" stroke="#e9d5ff"/><rect x="60" y="545" width="70" height="60" rx="14" fill="#3d006b"/><text x="95" y="585" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">R</text><text x="150" y="583" font-weight="700" fill="#3d006b">Refine</text><text x="330" y="583" fill="#1f2937">Follow-ups until right</text><text x="760" y="583" fill="#ea7a28" font-family="Menlo, monospace" font-size="18">'now handle 072...'</text>
  </g>
</svg>
