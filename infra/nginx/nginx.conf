events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  gzip              on;
  gzip_comp_level   5;
  gzip_min_length   256;
  gzip_proxied      any;
  gzip_vary         on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/x-javascript
    image/svg+xml;

  # Redirect HTTP to HTTPS
  server {
    listen 80;
    server_name learn.withintech.org api.learn.withintech.org;
    return 301 https://$host$request_uri;
  }

  # Frontend
  server {
    listen 443 ssl;
    server_name learn.withintech.org;

    ssl_certificate     /etc/letsencrypt/live/learn.withintech.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.withintech.org/privkey.pem;

    location / {
      proxy_pass         http://web:3000/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # API
  server {
    listen 443 ssl;
    server_name api.learn.withintech.org;

    ssl_certificate     /etc/letsencrypt/live/api.learn.withintech.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.learn.withintech.org/privkey.pem;

    location / {
      proxy_pass         http://api:3001/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
