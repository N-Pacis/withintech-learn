events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  gzip              on;
  gzip_comp_level   5;
  gzip_min_length   256;
  gzip_proxied      any;
  gzip_vary         on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/x-javascript
    image/svg+xml;

  # Redirect HTTP to HTTPS — use static names to avoid host header injection
  server {
    listen 80;
    server_name learn.withintech.org;
    return 301 https://learn.withintech.org$request_uri;
  }

  server {
    listen 80;
    server_name api.learn.withintech.org;
    return 301 https://api.learn.withintech.org$request_uri;
  }

  server {
    listen 80;
    server_name docs.learn.withintech.org;
    return 301 https://docs.learn.withintech.org$request_uri;
  }

  # Frontend
  server {
    listen 443 ssl;
    server_name learn.withintech.org;

    ssl_certificate     /etc/letsencrypt/live/learn.withintech.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.withintech.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass         http://web:3000/;
      proxy_http_version 1.1;
      proxy_set_header   Host $server_name;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # Docs (admin-only via auth_request)
  server {
    listen 443 ssl;
    server_name docs.learn.withintech.org;

    ssl_certificate     /etc/letsencrypt/live/docs.learn.withintech.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.learn.withintech.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location @docs_auth_error {
      return 302 "https://learn.withintech.org/sign-in?returnTo=docs&path=$request_uri";
    }

    # Auth subrequest — nginx calls the API to verify the admin cookie
    location = /auth/admin-check {
      internal;
      proxy_pass              http://api:3001/auth/admin-check;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length "";
      proxy_set_header        X-Original-URI $request_uri;
      proxy_set_header        Cookie $http_cookie;
    }

    location / {
      auth_request /auth/admin-check;

      # On auth failure, send to sign-in with the full docs URL as ?next=
      error_page 401 403 = @docs_auth_error;

      proxy_pass         http://docs:4000/;
      proxy_http_version 1.1;
      proxy_set_header   Host $server_name;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # API
  server {
    listen 443 ssl;
    server_name api.learn.withintech.org;

    ssl_certificate     /etc/letsencrypt/live/api.learn.withintech.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.learn.withintech.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass         http://api:3001/;
      proxy_http_version 1.1;
      proxy_set_header   Host $server_name;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
