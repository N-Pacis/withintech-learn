worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;

  # Resolve upstream containers at request time through Docker's DNS instead
  # of once at startup. docker-rollout replaces api/web containers (new IPs),
  # and a stopped service must not stop nginx from (re)loading — both used to
  # leave the whole site on 502. Every proxy_pass below goes through a
  # variable so this resolver is used.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  gzip              on;
  gzip_comp_level   5;
  gzip_min_length   256;
  gzip_proxied      any;
  gzip_vary         on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/x-javascript
    application/manifest+json
    image/svg+xml;

  # Next.js hashed build assets (/_next/static) never change for a given URL,
  # so nginx keeps a copy and serves repeats without touching Node.
  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m
                   max_size=200m inactive=7d use_temp_path=off;

  proxy_http_version 1.1;
  proxy_set_header   Host $server_name;
  proxy_set_header   X-Real-IP $remote_addr;
  proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;

  # Redirect HTTP to HTTPS — use static names to avoid host header injection
  server {
    listen 80;
    server_name learn.withintech.org;
    return 301 https://learn.withintech.org$request_uri;
  }

  server {
    listen 80;
    server_name api.learn.withintech.org;
    return 301 https://api.learn.withintech.org$request_uri;
  }

  server {
    listen 80;
    server_name docs.learn.withintech.org;
    return 301 https://docs.learn.withintech.org$request_uri;
  }

  # Frontend
  server {
    listen 443 ssl;
    http2 on;
    server_name learn.withintech.org;

    ssl_certificate     /etc/letsencrypt/live/learn.withintech.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.withintech.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    set $web_upstream http://web:3000;

    location /_next/static/ {
      proxy_pass        $web_upstream;
      proxy_cache       static;
      proxy_cache_valid 200 7d;
      proxy_cache_use_stale error timeout updating;
    }

    location / {
      proxy_pass       $web_upstream;
    }
  }

  # Docs (admin-only via auth_request)
  server {
    listen 443 ssl;
    http2 on;
    server_name docs.learn.withintech.org;

    ssl_certificate     /etc/letsencrypt/live/docs.learn.withintech.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.learn.withintech.org/privkey.pem;

    set $api_upstream  http://api:3001;
    set $docs_upstream http://docs:4000;

    location @docs_auth_error {
      return 302 "https://learn.withintech.org/sign-in?returnTo=docs&path=$request_uri";
    }

    # Auth subrequest — nginx calls the API to verify the admin cookie
    location = /auth/admin-check {
      internal;
      proxy_pass              $api_upstream/auth/admin-check;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length "";
      proxy_set_header        X-Original-URI $request_uri;
      proxy_set_header        Cookie $http_cookie;
    }

    location / {
      auth_request /auth/admin-check;

      # On auth failure, send to sign-in with the full docs URL as ?next=
      error_page 401 403 = @docs_auth_error;

      proxy_pass       $docs_upstream;
    }
  }

  # API
  server {
    listen 443 ssl;
    http2 on;
    server_name api.learn.withintech.org;

    ssl_certificate     /etc/letsencrypt/live/api.learn.withintech.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.learn.withintech.org/privkey.pem;

    set $api_upstream http://api:3001;

    location / {
      proxy_pass       $api_upstream;
    }
  }
}
