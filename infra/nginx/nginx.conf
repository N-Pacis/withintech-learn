events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Redirect HTTP to HTTPS
  server {
    listen 80;
    server_name 41.186.188.104.nip.io;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name 41.186.188.104.nip.io;

    ssl_certificate     /etc/letsencrypt/live/41.186.188.104.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/41.186.188.104.nip.io/privkey.pem;

    location /api/ {
      proxy_pass         http://api:3001/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      # Rewrite Location headers from Express back to include /api/ prefix
      # Fixes swagger-ui-express redirect: /docs/ -> /api/docs/
      proxy_redirect     ~^/(.*)$ /api/$1;
    }

    location / {
      proxy_pass         http://web:3000/;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
