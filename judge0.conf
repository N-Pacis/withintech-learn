################################################################################
# Judge0 configuration for withintech-learn challenges
# https://github.com/judge0/judge0/blob/master/judge0.conf
################################################################################

# PostgreSQL (Judge0's own DB — separate from app DB)
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0pass
POSTGRES_HOST=judge0-db

# Redis
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0redis

# CPU time limit per submission (seconds)
CPU_TIME_LIMIT=5

# Wall clock time limit (seconds) — longer to account for compile time
MAX_CPU_TIME_LIMIT=15

# Memory limit (KB): 256 MB
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=262144

# Disable network access for submitted code
ENABLE_NETWORK=false

# Max output file size (KB). Must be ≤ 4096. Default is 1024 (1 MB).
MAX_FILE_SIZE=1024

# Number of parallel workers — 1 on a single-CPU server
WORKERS=1

# How often workers poll Redis for new jobs (seconds).
# 0.5 balances responsiveness (saves up to 500ms vs 1.0) with CPU overhead.
INTERVAL=0.5

# Clear the queue of stuck submissions every 60 s
QUEUE_CLEARING_INTERVAL=60

# Don't allow submissions to run as root
ALLOW_ENABLE_PER_SUBMISSION=false

# Authentication — defense-in-depth on top of network isolation.
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=

# Callbacks disabled (we use wait=true instead)
CALLBACKS_MAX_TRIES=0

# App host
APP_HOST=0.0.0.0
PORT=2358

# Puma web server tuning (judge0-server only).
# WEB_CONCURRENCY=1 → single Puma process (no forking overhead).
# RAILS_MAX_THREADS=2 → 2 threads is enough since we use wait=true (synchronous).
WEB_CONCURRENCY=1
RAILS_MAX_THREADS=2

# Disable features we don't use — reduces boot time and idle overhead.
ENABLE_SUBMISSION_DELETE=false
ENABLE_CALLBACKS=false
USE_DOCS_AS_HOMEPAGE=false

# Rails log level — warn silences the per-request access logs that spam stdout.
RAILS_LOG_LEVEL=warn
