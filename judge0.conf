################################################################################
# Judge0 configuration for withintech-learn challenges
# https://github.com/judge0/judge0/blob/master/judge0.conf
################################################################################

# PostgreSQL (Judge0's own DB — separate from app DB)
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0pass

# Redis
REDIS_PASSWORD=judge0redis

# CPU time limit per submission (seconds)
CPU_TIME_LIMIT=5

# Wall clock time limit (seconds) — longer to account for compile time
MAX_CPU_TIME_LIMIT=15

# Memory limit (KB): 256 MB
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=262144

# Disable network access for submitted code
ENABLE_NETWORK=false

# Max code size (bytes): 64 KB
MAX_FILE_SIZE=65536

# Number of parallel workers — 1 on a single-CPU server
WORKERS=1

# How often workers poll Redis for new jobs (seconds).
# Default 0.1 burns CPU constantly even when idle; 1.0 is fine for a learning platform.
INTERVAL=1.0

# Clear the queue of stuck submissions every 60 s
QUEUE_CLEARING_INTERVAL=60

# Don't allow submissions to run as root
ALLOW_ENABLE_PER_SUBMISSION=false

# Authentication — leave empty for internal-only access
AUTHN_HEADER=
AUTHN_TOKEN=

# Callbacks disabled (we use wait=true instead)
CALLBACKS_MAX_TRIES=0

# App host
APP_HOST=0.0.0.0
PORT=2358
