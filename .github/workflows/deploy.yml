name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      # ── 1. Pull latest code ──────────────────────────────────────────────────
      - name: Pull latest code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 222
          script_stop: true
          script: |
            rm -rf $HOME/withintech-learn
            git clone https://N-Pacis:${{ secrets.GH_PAT }}@github.com/N-Pacis/withintech-learn.git $HOME/withintech-learn

      # ── 2. Write .env from secrets ───────────────────────────────────────────
      # To add a new secret: add it once below in env: and to the ENV_FILE block.
      - name: Write .env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 222
          script_stop: true
          envs: ENV_FILE
          script: printf '%s' "$ENV_FILE" > $HOME/withintech-learn/.env
        env:
          ENV_FILE: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_ACCESS_EXPIRES_IN=${{ secrets.JWT_ACCESS_EXPIRES_IN }}
            JWT_REFRESH_EXPIRES_IN=${{ secrets.JWT_REFRESH_EXPIRES_IN }}
            STORAGE_PROVIDER=${{ secrets.STORAGE_PROVIDER }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            APP_URL=${{ secrets.APP_URL }}
            NODE_ENV=${{ secrets.NODE_ENV }}
            PORT=${{ secrets.PORT }}
            ADMIN_SEED_EMAIL=${{ secrets.ADMIN_SEED_EMAIL }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            BCRYPT_ROUNDS=${{ secrets.BCRYPT_ROUNDS }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            EXECUTOR_URL=${{ secrets.EXECUTOR_URL }}
            EXECUTOR_SECRET=${{ secrets.EXECUTOR_SECRET }}
            JUDGE0_SECRET_KEY_BASE=${{ secrets.JUDGE0_SECRET_KEY_BASE }}
            JUDGE0_AUTH_TOKEN=${{ secrets.JUDGE0_AUTH_TOKEN }}
            API_BASE_URL=${{ secrets.API_BASE_URL }}
            NEXT_PUBLIC_BRAND_NAME=${{ secrets.NEXT_PUBLIC_BRAND_NAME }}
            NEXT_PUBLIC_SUPPORT_PHONE=${{ secrets.NEXT_PUBLIC_SUPPORT_PHONE }}
            NEXT_PUBLIC_SUPPORT_EMAIL=${{ secrets.NEXT_PUBLIC_SUPPORT_EMAIL }}
            NEXT_PUBLIC_SUPPORT_WEBSITE=${{ secrets.NEXT_PUBLIC_SUPPORT_WEBSITE }}
            NEXT_PUBLIC_SOCIAL_HANDLE=${{ secrets.NEXT_PUBLIC_SOCIAL_HANDLE }}
            NEXT_PUBLIC_SOCIAL_PLATFORMS=${{ secrets.NEXT_PUBLIC_SOCIAL_PLATFORMS }}
            XENTRIPAY_API_KEY=${{ secrets.XENTRIPAY_API_KEY }}
            XENTRIPAY_BASE_URL=${{ secrets.XENTRIPAY_BASE_URL }}

      # ── 3. Install docker-rollout (idempotent) ───────────────────────────────
      - name: Install docker-rollout
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 222
          script_stop: true
          script: |
            mkdir -p /usr/local/lib/docker/cli-plugins
            if [ ! -f /usr/local/lib/docker/cli-plugins/docker-rollout ]; then
              curl -fsSL https://github.com/wowu/docker-rollout/releases/latest/download/docker-rollout \
                -o /usr/local/lib/docker/cli-plugins/docker-rollout
              chmod +x /usr/local/lib/docker/cli-plugins/docker-rollout
            fi

      # ── 4. Build new images (old containers keep serving traffic) ────────────
      - name: Build new images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 222
          script_stop: true
          script: |
            cd $HOME/withintech-learn
            docker compose build

      # ── 5. Run migrations (throwaway container, old api still live) ──────────
      - name: Run migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 222
          command_timeout: 5m
          script_stop: true
          script: |
            cd $HOME/withintech-learn
            docker network create withintech_judge0_net 2>/dev/null || true
            docker compose run --rm --no-deps api sh -c "
              npx prisma migrate deploy &&
              node --max-old-space-size=512 dist/scripts/seed.js
            "

      # ── 6. Zero-downtime cutover via docker-rollout ──────────────────────────
      - name: Zero-downtime cutover
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 222
          script_stop: true
          script: |
            cd $HOME/withintech-learn

            # Ensure the shared executor<->judge0 network exists (idempotent;
            # also created in the migration step), then bring up Judge0.
            docker network create withintech_judge0_net 2>/dev/null || true
            docker compose -f docker-compose.judge0.yml up -d --remove-orphans

            # Recreate postgres/redis/nginx if their image or config changed
            docker compose up -d --no-build --remove-orphans postgres redis nginx

            # Bring up the executor (code runner bridge).
            docker compose up -d --no-build executor

            # docker-rollout handles: scale up, health check, old container removal.
            # It uses the Docker HEALTHCHECK defined in docker-compose.yml.
            docker rollout -f docker-compose.yml api
            docker rollout -f docker-compose.yml web

            # Reload nginx gracefully after the swap
            docker compose exec nginx nginx -s reload 2>/dev/null || true

      # ── 7. Clean up old images ───────────────────────────────────────────────
      - name: Clean up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 222
          script: |
            docker image prune -f
            docker system prune -f --volumes=false
