name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      # ── 1. Pull latest code ──────────────────────────────────────────────────
      - name: Pull latest code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 222
          script_stop: true
          script: |
            rm -rf $HOME/withintech-learn
            git clone https://N-Pacis:${{ secrets.GH_PAT }}@github.com/N-Pacis/withintech-learn.git $HOME/withintech-learn

      # ── 2. Write .env from secrets ───────────────────────────────────────────
      - name: Write .env
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 222
          script_stop: true
          envs: DATABASE_URL,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,JWT_ACCESS_EXPIRES_IN,JWT_REFRESH_EXPIRES_IN,STORAGE_PROVIDER,AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,S3_BUCKET_NAME,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,EMAIL_FROM,NEXT_PUBLIC_API_URL,APP_URL,NODE_ENV,PORT,ADMIN_SEED_EMAIL,POSTGRES_USER,POSTGRES_PASSWORD,BCRYPT_ROUNDS
          script: |
            {
              printf 'DATABASE_URL=%s\n'           "$DATABASE_URL"
              printf 'JWT_ACCESS_SECRET=%s\n'      "$JWT_ACCESS_SECRET"
              printf 'JWT_REFRESH_SECRET=%s\n'     "$JWT_REFRESH_SECRET"
              printf 'JWT_ACCESS_EXPIRES_IN=%s\n'  "${JWT_ACCESS_EXPIRES_IN:-24h}"
              printf 'JWT_REFRESH_EXPIRES_IN=%s\n' "${JWT_REFRESH_EXPIRES_IN:-7d}"
              printf 'STORAGE_PROVIDER=%s\n'       "${STORAGE_PROVIDER:-s3}"
              printf 'AWS_REGION=%s\n'             "$AWS_REGION"
              printf 'AWS_ACCESS_KEY_ID=%s\n'      "$AWS_ACCESS_KEY_ID"
              printf 'AWS_SECRET_ACCESS_KEY=%s\n'  "$AWS_SECRET_ACCESS_KEY"
              printf 'S3_BUCKET_NAME=%s\n'         "$S3_BUCKET_NAME"
              printf 'SMTP_HOST=%s\n'              "$SMTP_HOST"
              printf 'SMTP_PORT=%s\n'              "$SMTP_PORT"
              printf 'SMTP_USER=%s\n'              "$SMTP_USER"
              printf 'SMTP_PASS=%s\n'              "$SMTP_PASS"
              printf 'EMAIL_FROM=%s\n'             "$EMAIL_FROM"
              printf 'NEXT_PUBLIC_API_URL=%s\n'    "$NEXT_PUBLIC_API_URL"
              printf 'APP_URL=%s\n'                "$APP_URL"
              printf 'NODE_ENV=%s\n'               "${NODE_ENV:-production}"
              printf 'PORT=%s\n'                   "${PORT:-3001}"
              printf 'ADMIN_SEED_EMAIL=%s\n'       "$ADMIN_SEED_EMAIL"
              printf 'POSTGRES_USER=%s\n'          "$POSTGRES_USER"
              printf 'POSTGRES_PASSWORD=%s\n'      "$POSTGRES_PASSWORD"
              printf 'BCRYPT_ROUNDS=%s\n'          "${BCRYPT_ROUNDS:-12}"
            } > $HOME/withintech-learn/.env
        env:
          DATABASE_URL:           ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET:      ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET:     ${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRES_IN:  ${{ secrets.JWT_ACCESS_EXPIRES_IN }}
          JWT_REFRESH_EXPIRES_IN: ${{ secrets.JWT_REFRESH_EXPIRES_IN }}
          STORAGE_PROVIDER:       ${{ secrets.STORAGE_PROVIDER }}
          AWS_REGION:             ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID:      ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY:  ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME:         ${{ secrets.S3_BUCKET_NAME }}
          SMTP_HOST:              ${{ secrets.SMTP_HOST }}
          SMTP_PORT:              ${{ secrets.SMTP_PORT }}
          SMTP_USER:              ${{ secrets.SMTP_USER }}
          SMTP_PASS:              ${{ secrets.SMTP_PASS }}
          EMAIL_FROM:             ${{ secrets.EMAIL_FROM }}
          NEXT_PUBLIC_API_URL:    ${{ secrets.NEXT_PUBLIC_API_URL }}
          APP_URL:                ${{ secrets.APP_URL }}
          NODE_ENV:               ${{ secrets.NODE_ENV }}
          PORT:                   ${{ secrets.PORT }}
          ADMIN_SEED_EMAIL:       ${{ secrets.ADMIN_SEED_EMAIL }}
          POSTGRES_USER:          ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD:      ${{ secrets.POSTGRES_PASSWORD }}
          BCRYPT_ROUNDS:          ${{ secrets.BCRYPT_ROUNDS }}

      # ── 3. Build new images (old containers keep serving traffic) ────────────
      - name: Build new images
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 222
          script_stop: true
          script: |
            cd $HOME/withintech-learn
            # Tag what's currently live so we can roll back to it
            CURRENT=$(docker inspect withintech-learn-api --format '{{.Image}}' 2>/dev/null || echo "")
            [ -n "$CURRENT" ] && docker tag "$CURRENT" withintech-learn-api:rollback || true
            # Build fresh images — zero impact on running containers
            docker compose build

      # ── 4. Seed / migrate (against the live DB, before cutover) ─────────────
      - name: Run migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 222
          script_stop: true
          script: |
            cd $HOME/withintech-learn
            # Run migrations in a short-lived throwaway container using the NEW image.
            # The live API container is untouched and keeps serving traffic.
            # Migrations must be backward-compatible (expand-only, no breaking changes).
            docker compose run --rm --no-deps api \
              node --max-old-space-size=512 dist/scripts/seed.js

      # ── 5. Cut over: start new containers, wait for health, drop old ones ────
      - name: Zero-downtime cutover
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 222
          script_stop: true
          script: |
            cd $HOME/withintech-learn

            # Scale UP: start a second instance of the api alongside the current one.
            # Nginx/proxy continues routing to the original container during this window.
            docker compose up -d --no-build --scale api=2 --no-recreate api

            # Wait until at least one NEW api container is healthy
            echo "Waiting for new API instance to become healthy..."
            for i in $(seq 1 24); do
              # Count containers that are healthy AND running the new image
              NEW_IMAGE=$(docker compose images -q api | tail -1)
              HEALTHY=$(docker ps --filter "health=healthy" --format '{{.Image}}' \
                        | grep -c "$NEW_IMAGE" || true)
              echo "  attempt $i/24 — healthy new instances: $HEALTHY"
              [ "$HEALTHY" -ge 1 ] && break
              [ $i -eq 24 ] && echo "New API did not become healthy — aborting, old version still live" && exit 1
              sleep 5
            done

            # New container is healthy — now do the atomic swap.
            # Scale back to 1: Compose removes the OLD instance, keeps the NEW one.
            docker compose up -d --no-build --scale api=1 --remove-orphans

            # Reload nginx to flush any connection state (no restart = no downtime)
            docker compose exec nginx nginx -s reload 2>/dev/null || true

      # ── 6. Clean up old images ───────────────────────────────────────────────
      - name: Clean up
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 222
          script: |
            docker image prune -f
            docker system prune -f --volumes=false
