name: SAST

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    name: SAST (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --config p/react \
            --config p/owasp-top-ten \
            .

  gosec:
    name: SAST (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/executor/go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.27.1

      - name: Run gosec
        working-directory: apps/executor
        run: gosec ./...
